name: Release

# Triggered by pushing a version tag, e.g.:  git tag v1.0.0 && git push --tags
# Builds signed artifacts and uploads them to TestFlight (iOS) and the Google
# Play internal testing track (Android). Store submission for review remains a
# manual click in App Store Connect / Play Console.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  # ── Android → Google Play (internal track) ──────────────────────────────────
  android:
    name: Android → Play internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message if any signing/Play secret is missing.
      - name: Preflight — required Android secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD \
                   ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "See .github/DEPLOYMENT.md for how to obtain and add each one."
            exit 1
          fi
          echo "All required Android secrets are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Reconstruct the upload keystore and key.properties from secrets.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      # --build-number = CI run number (shared with the iOS job) so every
      # upload has a unique, increasing versionCode without editing pubspec.
      - name: Build signed AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Set up Ruby / fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to Play (internal)
        working-directory: android
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ runner.temp }}/play-key.json
          AAB_PATH: ${{ github.workspace }}/build/app/outputs/bundle/release/app-release.aab
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$GOOGLE_PLAY_JSON_KEY"
          fastlane internal

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ── iOS → TestFlight ────────────────────────────────────────────────────────
  ios:
    name: iOS → TestFlight
    # macos-14's Xcode 15 lacks the StoreKit APIs in_app_purchase_storekit
    # uses (iOS 18 SDK), and App Store uploads need the iOS 26 SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Fail fast with a clear message if any signing/ASC secret is missing,
      # rather than deep inside the fastlane upload.
      - name: Preflight — required iOS secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # Hard-required: without these, signing or the ASC upload cannot work.
          missing=()
          for v in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
                   IOS_PROVISIONING_PROFILE_BASE64 \
                   ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "See .github/DEPLOYMENT.md for how to obtain and add each one."
            exit 1
          fi
          # Optional: the Fastfile has fallbacks, but the defaults rarely match a
          # real profile name — warn so it isn't a silent signing failure.
          for v in IOS_PROVISIONING_PROFILE_NAME IOS_KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::warning::Optional secret $v not set — the Fastfile default will be used."
            fi
          done
          echo "Required iOS secrets are present."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # Build the Flutter iOS project without signing; fastlane's gym archives
      # and signs it with the imported distribution cert + profile.
      # --build-number = the CI run number so every upload is unique and
      # monotonically increasing (TestFlight rejects duplicate build numbers)
      # without hand-editing pubspec.yaml.
      - name: Flutter build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IPA_OUTPUT_DIR: ${{ runner.temp }}/ios-build
        run: fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/ios-build/ScanSignSend.ipa
          if-no-files-found: ignore
