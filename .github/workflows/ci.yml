name: CI

# Fast feedback on every push and PR: format, static analysis, tests, and a
# debug build for both platforms so a broken build never merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formatting is reported but not enforced, to avoid a repo-wide reformat
      # blocking merges. Run `dart format .` locally to tidy up.
      - name: Check formatting (non-blocking)
        run: dart format --output=none --set-exit-if-changed . || true
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      # Both consoles reject an upload when a listing field is one character
      # over, per language — so a Tamil overflow would only surface after six
      # other languages had been filled in by hand.
      - name: Check store listing character limits
        run: python3 store/listings/check_limits.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug build — no signing secrets required. The release pipeline
      # (release.yml) produces the signed AAB for the store.
      - name: Build debug APK
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (no codesign)
    # macos-14's Xcode 15 lacks the StoreKit APIs in_app_purchase_storekit
    # uses (iOS 18 SDK), and App Store uploads need the iOS 26 SDK.
    runs-on: macos-15
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Builds the iOS app without code signing so CI needs no certificates.
      # The signed IPA is produced in release.yml by fastlane `beta`, which
      # imports the distribution certificate and profile from secrets.
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
