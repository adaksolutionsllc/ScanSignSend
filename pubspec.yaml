name: scan_sign_send
description: "Scan, sign, and send documents. Offline. One-time purchase."
publish_to: 'none'

version: 1.0.1+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # Biometric / app lock
  local_auth: ^2.3.0

  # PDF generation & rendering
  # 28.x is the lowest line that allows intl 0.20.x, which flutter_localizations
  # (Flutter SDK) pins. Staying on 27.x would make localization unresolvable.
  syncfusion_flutter_pdf: ^28.2.12
  syncfusion_flutter_pdfviewer: ^28.2.12
  syncfusion_flutter_signaturepad: ^28.2.12

  # OCR — Google ML Kit Text Recognition on both iOS and Android
  google_mlkit_text_recognition: ^0.13.0

  # Image processing utilities
  image: ^4.2.0

  # In-app purchases (StoreKit 2 on iOS, Play Billing on Android)
  in_app_purchase: ^3.2.0

  # File import
  file_picker: ^8.0.0
  share_plus: ^10.0.0

  # Misc utils
  uuid: ^4.4.0
  # Pinned by flutter_localizations (Flutter SDK) — must match its intl version.
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations.dart from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  # Noto Sans for Hindi, Tamil and Telugu values in exported fillable PDFs
  # (the PDF's standard fonts are Latin-only). SIL OFL 1.1 — see OFL.txt.
  assets:
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/NotoSansTamil-Regular.ttf
    - assets/fonts/NotoSansTelugu-Regular.ttf
    - assets/fonts/OFL.txt

# App launcher icons — regenerate with:
#   dart run flutter_launcher_icons
# Source art is produced by branding/make_icon_3d.py (--variant gold --install).
flutter_launcher_icons:
  image_path: "branding/icon_master.png"
  android: "ic_launcher"
  # The gradient background image (not a flat colour) so the Android adaptive
  # icon matches the iOS one. icon_foreground.png is the mark alone on
  # transparency, scaled into Android's 66% safe zone.
  adaptive_icon_background: "branding/icon_background.png"
  adaptive_icon_foreground: "branding/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B0B10"

# Native launch screen — regenerate with:
#   dart run flutter_native_splash:create
# The mark is branding/icon_foreground.png cropped to its bounds; the Android 12+
# copy is padded into the 2/3-diameter circle the system masks splash icons to.
# One dark background in both themes so the splash matches the launcher icon.
flutter_native_splash:
  color: "#322f3c"
  image: branding/splash_mark.png
  android_12:
    color: "#322f3c"
    image: branding/splash_android12.png
  fullscreen: false
