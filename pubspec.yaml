name: scan_sign_send
description: "Scan, sign, and send documents. Offline. One-time purchase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Biometric / app lock
  local_auth: ^2.3.0

  # PDF generation & rendering
  syncfusion_flutter_pdf: ^27.2.2
  syncfusion_flutter_pdfviewer: ^27.2.2
  syncfusion_flutter_signaturepad: ^27.2.2

  # OCR — wraps VisionKit on iOS and ML Kit Text Recognition on Android
  google_mlkit_text_recognition: ^0.13.0

  # Image processing utilities
  image: ^4.2.0

  # Permissions
  permission_handler: ^11.3.1

  # In-app purchases (StoreKit 2 on iOS, Play Billing on Android)
  in_app_purchase: ^3.2.0

  # File import
  file_picker: ^8.0.0
  share_plus: ^10.0.0

  # Misc utils
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App launcher icons — regenerate with:
#   dart run flutter_launcher_icons
# Source art is produced by branding/make_icon.py from the ADAK Ventures logo.
flutter_launcher_icons:
  image_path: "branding/icon_master.png"
  android: "ic_launcher"
  adaptive_icon_background: "#0B0B10"
  adaptive_icon_foreground: "branding/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B0B10"
